name: SIT Nexus corporate migration checks

on:
  pull_request:
    branches:
      - main
      - migration/corporate-onprem-day1
  push:
    branches:
      - migration/corporate-onprem-day1

permissions:
  contents: read

concurrency:
  group: sit-nexus-corporate-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run corporate authorization tests
        run: npm run test:corporate

      - name: Typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build
